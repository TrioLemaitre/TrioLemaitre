<style>
  #footer {
    position: relative;
    display: block;
    background: var(--color-ink);
    color: var(--color-paper);
  }

  .footer-grid {
    display: grid;
    width: min(100%, var(--content-width));
    margin-inline: auto;
    padding: clamp(3rem, 6vw, 6rem) var(--page-gutter) 2rem;
    grid-template-columns: 1.6fr 1fr 1fr;
    gap: clamp(2.5rem, 5vw, 5rem);
  }

  .footer-intro,
  .footer-contact,
  .footer-links {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.55rem;
  }

  .footer-intro > p:last-child {
    max-width: 24rem;
    color: rgba(248, 245, 238, 0.5);
    font-size: 0.95rem;
  }

  .footer-logo {
    display: inline-block;
    margin-bottom: 1.5rem;
  }

  .footer-logo img {
    display: block;
    width: clamp(11rem, 16vw, 16rem);
    height: auto;
  }

  .footer-label {
    margin-bottom: 0.45rem;
    color: rgba(248, 245, 238, 0.5);
    font-size: var(--font-small);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .footer-contact a,
  .footer-links a {
    font-size: 0.95rem;
    line-height: 1.4;
  }

  .footer-meta-item {
    margin: 0;
    color: var(--color-paper);
    font-size: 0.95rem;
    line-height: 1.4;
  }

  .to-top {
    position: fixed;
    right: var(--page-gutter);
    bottom: 1.4rem;
    z-index: 45;
    display: grid;
    width: 3.5rem;
    height: 3.5rem;
    transform: translateY(6rem);
    place-items: center;
    border: 1px solid var(--color-ink);
    background: var(--color-blue-light);
    color: var(--color-ink);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
    border-radius: 0px;
    transition: opacity 300ms cubic-bezier(0.2, 0.7, 0.2, 1), transform 180ms ease, background-color 180ms ease, border-color 180ms ease, color 180ms ease, visibility 0s linear 300ms;
  }

  .to-top.is-visible {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
    visibility: visible;
    transition-delay: 0s;
  }

  .to-top svg {
    width: 1.4rem;
    fill: none;
    stroke: currentColor;
    stroke-linecap: square;
    stroke-width: 1.7;
  }

  @media (hover: hover) {
    .footer-contact a:hover,
    .footer-links a:hover {
      color: var(--color-orange-bright);
    }

    .to-top:hover {
      background: var(--color-orange);
      border-color: var(--color-ink);
      color: var(--color-ink);
      transform: scale(0.92);
    }
  }

  @media (max-width: 800px) {
    .footer-grid {
      grid-template-columns: 1fr 1fr;
    }

    .footer-intro {
      grid-column: 1 / -1;
    }
  }

  @media (max-width: 520px) {
    .footer-grid {
      grid-template-columns: 1fr;
    }

    .footer-intro {
      grid-column: auto;
    }
  }
</style>
