<style>
  #header {
    position: fixed;
    top: var(--header-top-offset);
    right: 0;
    left: 0;
    z-index: 50;
    padding-inline: var(--page-gutter);
    pointer-events: none;
  }

  .js .home #header {
    transform: translateY(calc(-100% - var(--header-top-offset)));
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
    transition: opacity 300ms cubic-bezier(0.2, 0.7, 0.2, 1), transform 300ms cubic-bezier(0.2, 0.7, 0.2, 1), visibility 0s linear 300ms;
  }

  .js .home #header.is-visible {
    transform: none;
    opacity: 1;
    pointer-events: auto;
    visibility: visible;
    transition-delay: 0s;
  }

  .headerbox {
    position: relative;
    display: grid;
    width: min(100%, var(--content-width));
    min-height: var(--header-row-height);
    margin-inline: auto;
    grid-template-columns: auto 1fr;
    align-items: center;
    border: 1px solid rgba(23, 23, 20, 0.9);
    background: var(--color-blue);
    box-shadow: 0 0 0 rgba(23, 23, 20, 0);
    pointer-events: auto;
    transition: background-color 220ms ease, box-shadow 220ms ease;
  }

  #header.is-scrolled .headerbox,
  #header.menu-open .headerbox {
    background: var(--color-blue);
    box-shadow: 0 0.5rem 2rem rgba(23, 23, 20, 0.1);
  }

  .wordmark {
    display: flex;
    min-height: var(--header-row-height);
    align-items: center;
    padding-inline: 1rem;
  }

  .wordmark img {
    display: block;
    width: clamp(11rem, 16vw, 16rem);
    height: auto;
  }

  .site-navigation {
    display: flex;
    align-items: stretch;
    justify-content: flex-end;
  }

  .site-navigation a {
    position: relative;
    display: inline-flex;
    min-height: var(--header-row-height);
    align-items: center;
    justify-content: center;
    padding-inline: clamp(0.8rem, 1.5vw, 1.5rem);
    border-left: 1px solid rgba(23, 23, 20, 0.3);
    font-size: var(--font-small);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease;
  }

  .site-navigation a::after {
    position: absolute;
    right: 0.9rem;
    bottom: 0.65rem;
    left: 0.9rem;
    height: 2px;
    transform: scaleX(0);
    transform-origin: left;
    background: currentColor;
    content: "";
    transition: transform 180ms ease;
  }

  .site-navigation a.is-active::after {
    transform: scaleX(1);
  }

  .site-navigation .nav-booking {
    background: var(--color-ink);
    color: var(--color-paper);
    gap: 0.45rem;
  }

  .site-navigation .nav-booking__arrow {
    display: inline-flex;
    align-items: center;
    line-height: 1;
    transform: translateY(0.08em);
  }

  .menu-toggle {
    display: none;
    min-height: var(--header-row-height);
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding-inline: 1rem;
    border-left: 1px solid var(--color-ink);
    background: transparent;
    cursor: pointer;
    font-size: var(--font-small);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease;
  }

  .menu-toggle__icon {
    display: grid;
    width: 1.4rem;
    gap: 0.35rem;
  }

  .menu-toggle__icon span {
    width: 100%;
    height: 2px;
    background: currentColor;
    transition: transform 180ms ease;
  }

  #header.menu-open .menu-toggle__icon span:first-child {
    transform: translateY(0.22rem) rotate(45deg);
  }

  #header.menu-open .menu-toggle__icon span:last-child {
    transform: translateY(-0.22rem) rotate(-45deg);
  }

  .scroll-progress {
    width: min(100%, var(--content-width));
    height: 6px;
    margin-inline: auto;
    overflow: hidden;
    pointer-events: none;
  }

  .scroll-progress span {
    display: block;
    width: 100%;
    height: 100%;
    transform: scaleX(0);
    transform-origin: left;
    background: var(--color-orange);
    will-change: transform;
  }

  @media (hover: hover) {
    .site-navigation a:hover {
      background: var(--color-blue-light);
      color: #fff;
      border-left-color: #fff;
    }

    .site-navigation .nav-booking:hover {
      background: var(--color-orange);
      color: #fff;
      border-left-color: #fff;
    }

    .menu-toggle:hover {
      color: #fff;
      border-left-color: #fff;
    }
  }

  @media (max-width: 800px) {
    .headerbox {
      grid-template-columns: 1fr auto;
    }

    .wordmark {
      min-height: var(--header-row-height);
      font-size: 1.25rem;
    }

    .menu-toggle {
      display: inline-flex;
    }

    .site-navigation {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: -1px;
      left: -1px;
      display: grid;
      grid-template-columns: 1fr;
      justify-content: stretch;
      transform: translateY(-0.7rem);
      border: 1px solid var(--color-ink);
      background: var(--color-blue);
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 180ms ease, transform 180ms ease, visibility 0s linear 180ms;
    }

    .site-navigation.is-open {
      transform: none;
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      transition-delay: 0s;
    }

    .site-navigation a {
      min-height: 3.8rem;
      justify-content: center;
      border-top: 1px solid rgba(23, 23, 20, 0.25);
      border-left: 0;
    }

    .site-navigation a:first-child {
      border-top: 0;
    }
  }
</style>

<div class="headerbox" id="headerbox">
  <a class="wordmark" href="index.html#start" aria-label="Trio Lemaître – Startseite">
    <img src="images/logo.svg" alt="Trio Lemaître">
  </a>

  <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
    <span class="menu-toggle__label">Menü</span>
    <span class="menu-toggle__icon" aria-hidden="true">
      <span></span>
      <span></span>
    </span>
  </button>

  <nav class="site-navigation" id="site-navigation" aria-label="Hauptnavigation">
    <a href="index.html#sound">Der Sound</a>
    <a href="index.html#band">Das Trio</a>
    <a class="nav-booking" href="index.html#kontakt">Booking <span class="nav-booking__arrow" aria-hidden="true">↗</span></a>
  </nav>
</div>
<div class="scroll-progress" aria-hidden="true"><span id="scroll-progress-bar"></span></div>
